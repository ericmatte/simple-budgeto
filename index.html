<!-- Applies the stored theme before the stylesheet paints. Deferring this to
     app.js would flash the default (light) palette on every load for anyone
     who chose dark. -->
<script>
  try {
    var t = localStorage.getItem('budgeto.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode: fall through to the default */ }
</script>
