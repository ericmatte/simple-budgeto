<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Budgeto</title>
<!-- Applies the stored theme before the stylesheet paints. Deferring this to
     app.js would flash the default (dark) palette on every load for anyone
     who chose light. -->
<script>
  try {
    var t = localStorage.getItem('budgeto.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode: fall through to the default */ }
</script>
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/transactions.css">
</head>
<body>
<div id="app">Chargement…</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
